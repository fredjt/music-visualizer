name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Check tag matches [project].version
      env:
        TAG: ${{ github.ref_name }}
      run: |
        PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        if [ "${TAG#v}" != "$PKG_VERSION" ]; then
          echo "::error::Tag ${TAG} does not match [project].version ${PKG_VERSION} (pyproject.toml)"
          exit 1
        fi
        echo "Tag and package version agree: ${PKG_VERSION}"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Extract release notes from CHANGELOG
      env:
        TAG: ${{ github.ref_name }}
      run: |
        VERSION="${TAG#v}"
        python - "$VERSION" <<'PY'
        import re
        import sys

        version = sys.argv[1]
        text = open("CHANGELOG.md", encoding="utf-8").read()

        # Prefer the section for the released version; fall back to [Unreleased]
        section = re.search(
            rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)", text, re.M | re.S
        )
        source = f"[{version}]"
        if section is None:
            section = re.search(
                r"^## \[Unreleased\].*?(?=^## \[|\Z)", text, re.M | re.S
            )
            source = "[Unreleased]"
        if section is None:
            sys.exit(
                f"CHANGELOG.md has no '## [{version}]' or '## [Unreleased]' section"
            )

        notes = section.group(0).strip() + "\n"
        open("RELEASE_NOTES.md", "w", encoding="utf-8").write(notes)
        print(f"Release notes from CHANGELOG {source}: {len(notes)} chars")
        PY

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        gh release create "$TAG" \
          --title "$TAG" \
          --notes-file RELEASE_NOTES.md \
          --target "$(git rev-list -n1 "$TAG")" \
          dist/*
