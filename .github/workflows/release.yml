name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Check tag matches [project].version
      env:
        TAG: ${{ github.ref_name }}
      run: |
        PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        if [ "${TAG#v}" != "$PKG_VERSION" ]; then
          echo "::error::Tag ${TAG} does not match [project].version ${PKG_VERSION} (pyproject.toml)"
          exit 1
        fi
        echo "Tag and package version agree: ${PKG_VERSION}"

    - name: Check tag commit is reachable from master
      # Tags cut from side branches would release code that never merged
      # (v2.2.0 sec.5.2).
      run: |
        git fetch origin master
        if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
          echo "::error::Tag commit $(git rev-parse HEAD) is not reachable from master — tags must be cut from the default branch"
          exit 1
        fi
        echo "Tag commit is reachable from master"

    - name: Check built metadata project name
      # The built wheel/sdist must name the expected PyPI project before
      # the pypi job publishes anything (v2.2.0 sec.5.2).
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build
        python - <<'PY'
        import glob
        import sys
        import tarfile
        import zipfile

        expected = "musicvisualizer"

        def check(label: str, name: str) -> None:
            if name != expected:
                sys.exit(f"{label}: built metadata Name is '{name}', expected '{expected}'")
            print(f"{label}: Name={name} ok")

        def first_name(lines) -> str | None:
            for line in lines:
                if line.startswith("Name: "):
                    return line.split("Name: ", 1)[1].strip()
            return None

        wheel = glob.glob("dist/*.whl")[0]
        with zipfile.ZipFile(wheel) as z:
            meta = [n for n in z.namelist() if n.endswith(".dist-info/METADATA")][0]
            check("wheel", first_name(z.read(meta).decode().splitlines()) or "<missing>")

        sdist = glob.glob("dist/*.tar.gz")[0]
        with tarfile.open(sdist) as t:
            pkginfo = [m for m in t.getnames() if m.endswith("PKG-INFO")][0]
            check("sdist", first_name(t.extractfile(pkginfo).read().decode().splitlines()) or "<missing>")
        PY

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Extract release notes from CHANGELOG
      env:
        TAG: ${{ github.ref_name }}
      run: |
        VERSION="${TAG#v}"
        python - "$VERSION" <<'PY'
        import re
        import sys

        version = sys.argv[1]
        text = open("CHANGELOG.md", encoding="utf-8").read()

        # Prefer the section for the released version; fall back to [Unreleased]
        section = re.search(
            rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)", text, re.M | re.S
        )
        source = f"[{version}]"
        if section is None:
            section = re.search(
                r"^## \[Unreleased\].*?(?=^## \[|\Z)", text, re.M | re.S
            )
            source = "[Unreleased]"
        if section is None:
            sys.exit(
                f"CHANGELOG.md has no '## [{version}]' or '## [Unreleased]' section"
            )

        notes = section.group(0).strip() + "\n"
        open("RELEASE_NOTES.md", "w", encoding="utf-8").write(notes)
        print(f"Release notes from CHANGELOG {source}: {len(notes)} chars")
        PY

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        gh release create "$TAG" \
          --title "$TAG" \
          --notes-file RELEASE_NOTES.md \
          --target "$(git rev-list -n1 "$TAG")" \
          dist/*

  post-release:
    # v2.2.0 sec.5.1: after the GitHub release exists, push a commit that
    # restores the '## [Unreleased]' section at the top of CHANGELOG.md
    # (the cut consumed it as the release notes) and open a PR for it.
    # Every future tag then has a guaranteed [Unreleased] fallback for
    # notes extraction — cutting a release no longer depends on
    # remembering the stub.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Stub [Unreleased] for the next cycle
      run: |
        python - <<'PY'
        import re
        import sys

        text = open("CHANGELOG.md", encoding="utf-8").read()
        if re.search(r"^## \[Unreleased\]", text, re.M):
            print("CHANGELOG.md already has an [Unreleased] section; nothing to do")
            sys.exit(0)
        m = re.search(r"^## \[", text, re.M)
        if m is None:
            sys.exit("CHANGELOG.md has no version sections; cannot stub [Unreleased]")
        text = text[: m.start()] + "## [Unreleased]\n\n" + text[m.start() :]
        open("CHANGELOG.md", "w", encoding="utf-8").write(text)
        print("Inserted '## [Unreleased]' at the top of CHANGELOG.md")
        PY

    - name: Push stub branch and open PR
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        BASE: ${{ github.event.repository.default_branch }}
      run: |
        if git diff --quiet; then
          echo "No changes (stub already present); skipping PR"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        BRANCH="chore/stub-unreleased-${TAG#v}"
        git checkout -b "$BRANCH"
        git add CHANGELOG.md
        git commit -m "chore: stub [Unreleased] for next cycle" \
          -m "Automated post-release stub for ${TAG} (v2.2.0 sec.5.1): restores the empty section consumed by the release cut."
        git push origin "$BRANCH"
        gh pr create --base "$BASE" --head "$BRANCH" \
          --title "chore: stub [Unreleased] for next cycle" \
          --body "Automated post-release stub for ${TAG} (v2.2.0 sec.5.1). Restores the empty '## [Unreleased]' section consumed by the release cut so the next release's notes extraction has a section to find."

  pypi:
    # PyPI trusted publishing: the job runs in the 'pypi' environment and
    # presents the OIDC identity
    #   repo:fredjt/music-visualizer:environment:pypi
    # which must be configured as a trusted publisher for the
    # 'audio-visualizer' project on pypi.org (no token involved).
    needs: [build, release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install twine
      run: |
        python -m pip install --upgrade pip
        pip install twine

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Check package metadata
      run: twine check dist/*

    - name: Publish to PyPI (OIDC trusted publishing)
      run: twine upload --non-interactive dist/*

