name: Build

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  pull_request:
    branches: [master, main]

jobs:
  tag-version-check:
    # A tag must name the version that [project].version in pyproject.toml
    # declares, so a stale checkout can never build misnamed artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Check tag matches [project].version
      env:
        TAG: ${{ github.ref_name }}
      run: |
        PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        if [ "${TAG#v}" != "$PKG_VERSION" ]; then
          echo "::error::Tag ${TAG} does not match [project].version ${PKG_VERSION} (pyproject.toml)"
          exit 1
        fi
        echo "Tag and package version agree: ${PKG_VERSION}"

  build:
    # Tag builds are handled by the Release workflow
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build setuptools wheel

    - name: Build package
      run: |
        python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
