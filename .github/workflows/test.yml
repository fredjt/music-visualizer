name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: pip

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run tests (PR: unit + smoke subset)
      # PRs get fast feedback: no full-length encodes, no coverage.
      # Smoke = one short encode per visualizer (tests/test_e2e.py::TestSmoke).
      if: github.event_name == 'pull_request'
      run: pytest tests/ -v --tb=short --no-cov -m "smoke or not e2e"

    - name: Run tests with coverage (push: full suite)
      if: github.event_name == 'push'
      run: pytest tests/ -v --tb=short --cov-report=xml --cov-branch

    - name: Upload coverage to Codecov
      if: github.event_name == 'push'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install dev dependencies
      run: pip install .[dev]

    - name: Run ruff linter
      run: ruff check .

    - name: Run ruff formatter check
      run: ruff format --check .

    - name: Run pyright type checker
      run: pyright

    - name: Check README flag reference matches the CLI
      run: python scripts/generate_flag_reference.py --check
