[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-visualizer"
version = "2.0.0"
description = "A plugin-based audio visualization tool that converts audio files into animated visualizer videos"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "fredjt", email = "61065187+fredjt@users.noreply.github.com"}
]
keywords = ["audio", "visualizer", "ffmpeg", "music", "video"]
dependencies = [
    "tqdm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]

[project.scripts]
audio-visualizer = "audio_visualizer.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "--cov=audio_visualizer --cov-report=term-missing --cov-fail-under=65 --cov-branch"
testpaths = ["tests"]

[tool.coverage.run]
source = ["audio_visualizer"]
omit = []

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
where = ["."]
include = ["audio_visualizer*"]
